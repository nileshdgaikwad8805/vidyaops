<section class="chatbot" aria-label="VidyaOps chatbot">
  <button
    class="chatbot__toggle"
    type="button"
    [attr.aria-expanded]="isOpen()"
    aria-controls="chatbot-panel"
    (click)="toggle()"
  >
    @if (!isOpen()) {
      <span class="chatbot__toggle-icon">💬</span>
    }
    {{ isOpen() ? 'Close' : 'Ask AI' }}
  </button>

  <div class="chatbot__panel" id="chatbot-panel" [hidden]="!isOpen()">
    <div class="chatbot__header">
      <div>
        <strong>VidyaOps AI</strong>
        <p>Ask about trainings, workshops, pricing, and more.</p>
      </div>
      <button class="chatbot__close" type="button" aria-label="Close chatbot" (click)="close()">×</button>
    </div>

    <div class="chatbot__messages" aria-live="polite">
      @for (message of messages(); track $index) {
        <div class="chatbot__bubble" [class.chatbot__bubble--user]="message.sender === 'user'" [class.chatbot__bubble--bot]="message.sender === 'bot'">
          {{ message.text }}
        </div>
      }

      @if (isLoading()) {
        <div class="chatbot__bubble chatbot__bubble--bot chatbot__bubble--loading">
          <span class="chatbot__typing-dot"></span>
          <span class="chatbot__typing-dot"></span>
          <span class="chatbot__typing-dot"></span>
        </div>
      }
    </div>

    <form class="chatbot__form" (ngSubmit)="sendMessage()">
      <input
        class="chatbot__input"
        type="text"
        name="message"
        placeholder="Ask about AI training, workshops..."
        autocomplete="off"
        [(ngModel)]="draft"
      />
      <button class="button button--primary" type="submit" [disabled]="!draft().trim() || isLoading()">Send</button>
    </form>

    <div class="chatbot__quick">
      <a href="https://wa.me/919503685152?text=Hello%20VidyaOps%2C%20I%20want%20to%20know%20more%20about%20your%20trainings%20and%20workshops." target="_blank" rel="noreferrer">
        Prefer WhatsApp? Chat with us &rarr;
      </a>
    </div>
  </div>
</section>
