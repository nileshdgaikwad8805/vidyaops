services:
  - type: web
    name: vidyaops-app
    env: node
    plan: free
    buildCommand: npm install && npx ng build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://www.vidyaops.com,https://vidyaops.com,https://vidyaops.onrender.com
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://www.vidyaops.com
      - key: NOTIFY_EMAIL_TO
        value: info@vidyaops.com
    disk:
      name: skillnest-data
      mountPath: /opt/render/project/data
      sizeGB: 1
